[package]
name = "skia-rs-gpu"
description = "GPU backends for skia-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/skia-rs-gpu"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
# Backend selection - choose one
vulkan = ["dep:ash"]
opengl = ["dep:glow"]
metal = ["dep:metal"]
wgpu-backend = ["dep:wgpu", "dep:pollster"]

# WebGPU for WASM
webgpu = ["wgpu-backend"]

[dependencies]
skia-rs-core = { workspace = true }
skia-rs-path = { workspace = true }
skia-rs-paint = { workspace = true }
skia-rs-codec = { workspace = true }
ash = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
# naga is a direct dep for real WGSL validation. wgpu already pulls it in
# transitively at the same major version; declaring it explicitly lets us
# call naga::front::wgsl outside the wgpu-backend feature gate.
naga = { version = "23", features = ["wgsl-in"] }

# The `metal` crate pulls `core-graphics-types` with an Apple-only
# `framework` link directive, so it can only be built for macOS / iOS
# targets. The `metal` feature is still declarable on other platforms
# (e.g. for documenting it on docs.rs with mocked backends) but the
# dependency itself is gated here so `cargo check --all-features` works
# on Linux.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"], optional = true }

[dev-dependencies]
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
