[package]
name = "skia-rs-python"
description = "Python bindings for skia-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["skia", "graphics", "2d", "python", "bindings"]
categories = ["graphics", "api-bindings"]
readme = "README.md"

[lib]
name = "skia_rs"
crate-type = ["cdylib"]
# This is a PyO3 extension module whose lib name (`skia_rs`, the importable
# Python module) intentionally matches the umbrella crate. rustdoc emits both
# to the same `skia_rs` path, which collides under `cargo doc --workspace`.
# The Rust docs for the extension glue are not useful, so exclude it.
doc = false

[features]
png = []

[dependencies]
skia-rs-core = { workspace = true }
skia-rs-path = { workspace = true }
skia-rs-paint = { workspace = true }
skia-rs-canvas = { workspace = true }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.24"

[lints]
workspace = true
