[package]
name = "skia-rs-ffi"
description = "C FFI bindings for skia-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/skia-rs-ffi"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
skia-rs-core = { workspace = true }
skia-rs-path = { workspace = true }
skia-rs-paint = { workspace = true }
skia-rs-canvas = { workspace = true, features = ["text", "codec"] }
skia-rs-text = { workspace = true }
skia-rs-codec = { workspace = true }
skia-rs-gpu = { workspace = true }
libc = { workspace = true }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints]
workspace = true
